<section id="career" *ngIf="isLoading(); else careerContent">
  <div class="container">
    <div class="career-skel-wrapper">
      <div class="skel skel-eyebrow"></div>
      <div class="skel skel-title"></div>
      <div class="skel skel-sub"></div>
      <div class="career-skel-stats">
        <div class="skel skel-stat" *ngFor="let _ of [1,2,3,4]"></div>
      </div>
    </div>
  </div>
</section>

<ng-template #careerContent>
  <section id="career" *ngIf="data() as d">
    <div class="container">

      <div #careerBlock class="career-showcase-wrapper">
        
        <div class="showcase-bg-canvas">
          
         <svg  viewBox="0 0 500 300" preserveAspectRatio="none">
              <defs>
                <linearGradient id="stepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#22d3ee" />
                  <stop offset="80%" stop-color="#3b82f6" />
                  <stop offset="100%" stop-color="#818cf8" />
                </linearGradient>
              </defs>
              <path class="step-path" d="M 15 250 L 65 250 L 65 210 L 125 210 L 125 165 L 185 165 L 185 120 L 245 120 L 245 80 L 305 80 L 305 50 L 365 50 L 365 30 L 430 30 L 430 25 L 490 25" />
              <circle cx="65" cy="210" r="3" fill="#7dd3fc" />
              <circle cx="185" cy="120" r="3" fill="#7dd3fc" />
              <circle cx="305" cy="50" r="3" fill="#7dd3fc" />
              <circle cx="430" cy="25" r="3" fill="#7dd3fc" />
            </svg>
        </div>

        <div class="career-foreground-panel">
          <span class="eyebrow">{{ d.eyebrow }}</span>
          <h2>{{ d.title }}</h2>
          <p class="lead">{{ d.lead }}</p>

          <div class="stats">
            <div *ngFor="let label of statLabels(); let i = index" class="stat">
              <div class="n">{{ displayStats()[i] || '0' }}</div>
              <div class="l">{{ label }}</div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </section>
</ng-template>
