<!-- Skeleton: visible while ContentService awaits the first API response -->
<section id="about" class="about-section" *ngIf="isLoading(); else contentBlock">
  <div class="about-container">
    <div class="about-grid">

      <div class="about-content">
        <div class="skel skel-eyebrow"></div>
        <div class="skel skel-title"></div>
        <div class="skel skel-title skel-title--short"></div>
        <div class="skel skel-sub"></div>
        <div class="skel skel-sub skel-sub--narrow"></div>

        <div class="skel-card">
          <div class="skel skel-icon"></div>
          <div class="skel-card-body">
            <div class="skel skel-card-title"></div>
            <div class="skel skel-card-text"></div>
          </div>
        </div>
        <div class="skel-card">
          <div class="skel skel-icon"></div>
          <div class="skel-card-body">
            <div class="skel skel-card-title"></div>
            <div class="skel skel-card-text"></div>
          </div>
        </div>
      </div>

      <div class="skel skel-img"></div>

    </div>
  </div>
</section>

<!-- Resolved content -->
<ng-template #contentBlock>
  <section id="about" class="about-section" *ngIf="data() as d">
    <div class="about-container">
      <div class="about-grid">

        <div class="about-content">
          <span class="eyebrow-tag">{{ d.eyebrow }}</span>
          <h2 class="main-title">{{ d.title }}</h2>
          <p class="sub-lead">{{ d.sub }}</p>

          <div class="highlight-card" *ngFor="let h of d.highlights; let i = index">
            <div class="icon-frame" *ngIf="h.icon" [innerHTML]="h.icon | faIcon"></div>
            <div class="card-body">
              <h4 class="card-title">{{ h.title }}</h4>

              <p #descText class="description-text" [class.expanded]="isExpanded(i)">
                {{ h.description }}
              </p>

              <button *ngIf="canExpand(i)" class="read-more-link" (click)="toggleExpand(i)">
                {{ isExpanded(i) ? 'Read less ↑' : 'Read more →' }}
              </button>
            </div>
          </div>
        </div>

        <div class="about-image-wrapper">
          <div class="image-frame">
            <img
              [src]="imageUrl(d.image)"
              alt="About Parallel Matrix"
              loading="lazy"
              width="600"
              height="600"
            >
          </div>
        </div>

      </div>
    </div>
  </section>
</ng-template>
